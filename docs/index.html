<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="config.js"></script>
<title>Empire Events Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preload" href="fonts/lemonmilk-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/spitz-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/spitz-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Inter+Tight:wght@400;500;600&display=swap">
<style>
/* Empire brand fonts, served under Empire's web licences: Lemon Milk (display) and Linotype Spitz (text).
   Forum / Inter Tight are fallbacks while they load. */
@font-face{font-family:"Lemon Milk";src:url(fonts/lemonmilk-300.woff2) format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:"Lemon Milk";src:url(fonts/lemonmilk-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Lemon Milk";src:url(fonts/lemonmilk-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Lemon Milk";src:url(fonts/lemonmilk-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Linotype Spitz";src:url(fonts/spitz-300.woff2) format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:"Linotype Spitz";src:url(fonts/spitz-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Linotype Spitz";src:url(fonts/spitz-700.woff2) format("woff2");font-weight:700;font-display:swap}
/* Empire Scottsdale brand (empirescottsdale.com): #131313 ground, #F2B000 gold, white type, 10–12px radii.
   Layout for a 16:9 lobby TV: flyer panel left, details right, RSVP card bottom-aligned with the flyer.
   --u is 1% of the screen height (capped by width), so everything scales from 720p to 4K. */
:root{
  /* Matched to the bar menu: warm black, the same gold, ivory type, hairline gold rules. */
  --bg:#0c0b09; --panel:#16130e; --gold-rgb:242,176,0; --line:rgba(242,176,0,.16); --hair:rgba(242,176,0,.2);
  --gold:#f2b000; --white:#f3ecdf; --ivory:#ebe5d9; --mute:rgba(243,236,223,.66); --faint:rgba(243,236,223,.44);
  --display:"Lemon Milk","Forum",Georgia,serif;
  --body:"Linotype Spitz","Inter Tight","Helvetica Neue",Arial,sans-serif;
  --u:min(1vh,.5625vw);
  --radius:0px;
  --slide-ms:15000;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--white);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
/* A soft gold glow at the top and a dark vignette, as on the menu. */
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 55% 38% at 50% 0%,rgba(var(--gold-rgb),.085),transparent 72%),
  radial-gradient(ellipse 120% 95% at 50% 50%,transparent 58%,rgba(0,0,0,.6))}
/* The frame: the menu's rules, corners and pearls, broken at the bottom for the logo. Drawn by frame(). */
.frame{position:fixed;inset:0;pointer-events:none}
.frame svg{width:100%;height:100%;fill:none;stroke:var(--gold);stroke-linecap:round}
.frame .outer{opacity:.3}.frame .inner{opacity:.42}.frame .orn{opacity:.62}.frame .fillet{opacity:.16}
.frame .bead{fill:var(--gold);stroke:none}.frame .pearl{fill:var(--gold);stroke:none;opacity:.32}
.screen{position:relative;height:100%;display:grid;grid-template-rows:1fr auto;gap:calc(var(--u)*3.6);
  padding:calc(var(--u)*10.5) calc(var(--u)*12) calc(var(--u)*3.6);cursor:none}
.screen.awake{cursor:default}


/* Featured event on the left, the agenda of everything coming up on the right. */
.main{display:grid;grid-template-columns:minmax(0,1fr) calc(var(--u)*44);gap:calc(var(--u)*5.5);min-height:0}
.stage{position:relative;min-height:0}
.slide{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:calc(var(--u)*5.5);
  opacity:0;transition:opacity .8s ease;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}

/* Flyer panel: the flyer whole and as large as fits, over a blurred, darkened copy of itself. */
.art{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--panel);display:grid;place-items:center;min-height:0;
  border:1px solid rgba(var(--gold-rgb),.42);box-shadow:inset 0 0 0 calc(var(--u)*.9) var(--bg),inset 0 0 0 calc(var(--u)*.9 + 1px) rgba(var(--gold-rgb),.18)}
.art .wash{position:absolute;inset:-12%;background:center/cover no-repeat;filter:blur(calc(var(--u)*5)) brightness(.42) saturate(1.15);transform:scale(1.04)}
/* Sized by sizeArt() to the largest box that fits, so small source images scale up too. */
.art img{position:relative;display:block;max-width:none;border-radius:calc(var(--radius)*.6);box-shadow:0 calc(var(--u)*2) calc(var(--u)*6) rgba(0,0,0,.55)}
.slide.on .art .wash{animation:drift calc(var(--slide-ms)*1ms) linear forwards}
@keyframes drift{to{transform:scale(1.12)}}
/* No flyer: a big date card instead. */
.art.datecard{background:linear-gradient(160deg,#1b1711,#100e0b);align-content:center;justify-items:center;gap:calc(var(--u)*1)}
.datecard .dnum{font-family:var(--display);font-weight:300;font-size:calc(var(--u)*30);line-height:.85;color:var(--gold)}
.datecard .dmon{font-family:var(--display);font-weight:400;letter-spacing:.34em;text-transform:uppercase;font-size:calc(var(--u)*2.8)}

.info{display:flex;flex-direction:column;min-height:0;min-width:0;padding-block:calc(var(--u)*1)}
.top{display:flex;flex-direction:column;gap:calc(var(--u)*2.2);min-height:0;overflow:hidden}
.top>*{flex-shrink:0} /* overflow must show up on .top, where fit() measures it, not squash the items */
.date{color:var(--gold);font-family:var(--display);font-weight:400;letter-spacing:.3em;text-transform:uppercase;font-size:calc(var(--u)*2.5)}
.time{font-family:var(--display);font-weight:300;letter-spacing:.18em;font-size:calc(var(--u)*2.9);margin-top:calc(var(--u)*-.6);font-variant-numeric:tabular-nums}
h1{font-family:var(--display);font-weight:300;letter-spacing:.05em;margin:calc(var(--u)*.8) 0 calc(var(--u)*.2);line-height:1.04;text-wrap:balance;font-size:calc(var(--u)*7)}
.where{display:flex;align-items:center;gap:.5em;font-size:calc(var(--u)*3);font-weight:500}
.where svg{width:.95em;height:.95em;flex:none;fill:var(--gold)}
.blurb{margin:0;color:var(--mute);font-size:calc(var(--u)*2.7);line-height:1.45;max-width:34em;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--clamp,4);overflow:hidden}

/* RSVP card sits on the flyer's bottom edge. */
.rsvp{margin-top:auto;padding-top:calc(var(--u)*3);display:flex;align-items:center;gap:calc(var(--u)*3)}
.qr{flex:none;width:calc(var(--u)*20);aspect-ratio:1;background:var(--white);border-radius:var(--radius);padding:calc(var(--u)*1.5);
  outline:1px solid rgba(var(--gold-rgb),.42);outline-offset:calc(var(--u)*.9)}
.qr svg{display:block;width:100%;height:100%;fill:var(--bg)}
.rsvp .cta{font-family:var(--display);font-weight:400;letter-spacing:.2em;color:var(--gold);font-size:calc(var(--u)*2.7);line-height:1.15;white-space:nowrap}
.rsvp .url{color:var(--faint);font-size:calc(var(--u)*2.3);margin-top:calc(var(--u)*1);overflow-wrap:anywhere}
.rsvp .pill{display:inline-block;margin-bottom:calc(var(--u)*1.6);border:1px solid rgba(var(--gold-rgb),.5);color:var(--gold);
  font-family:var(--display);font-weight:400;font-size:calc(var(--u)*1.8);letter-spacing:.26em;text-transform:uppercase;padding:.7em 1.1em .6em}
.rsvp.walkin .cta{color:var(--white);font-weight:300}
.rsvp.walkin .url{color:var(--mute)}

/* Agenda: every upcoming event, the featured one highlighted; the list glides up a row per slide
   and wraps (it is rendered twice so the loop is seamless). The fade at the bottom says "more below". */
.agenda{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);padding-left:calc(var(--u)*4)}
.ag-head{display:grid;gap:calc(var(--u)*1.1);padding-bottom:calc(var(--u)*2);border-bottom:1px solid var(--line)}
.ag-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:calc(var(--u)*2.7);line-height:1;letter-spacing:.3em;color:var(--gold);white-space:nowrap}
.ag-count{color:var(--mute);font-size:calc(var(--u)*2.1);letter-spacing:.03em;white-space:nowrap}
.ag-window{position:relative;flex:1;min-height:0;overflow:hidden;margin-top:calc(var(--u)*1.6);
  -webkit-mask-image:linear-gradient(transparent,#000 16%,#000 76%,transparent);mask-image:linear-gradient(transparent,#000 16%,#000 76%,transparent)}
.ag-list{list-style:none;margin:0;padding:0;transition:transform .9s cubic-bezier(.4,0,.2,1)}
.ag-list.snap{transition:none}
.ag-item{display:grid;grid-template-columns:calc(var(--u)*7.5) minmax(0,1fr);align-items:center;gap:calc(var(--u)*2.2);
  padding:calc(var(--u)*1.5) calc(var(--u)*1.8);margin-bottom:calc(var(--u)*.8);border-radius:var(--radius);
  border-left:calc(var(--u)*.45) solid transparent;transition:background .6s,border-color .6s}
.ag-item.on{background:linear-gradient(90deg,rgba(var(--gold-rgb),.09),rgba(var(--gold-rgb),.02));border-left-color:var(--gold)}
.ag-date{display:grid;justify-items:center;line-height:1;font-variant-numeric:tabular-nums}
.ag-date .dw{color:var(--gold);font-family:var(--display);font-weight:400;letter-spacing:.22em;font-size:calc(var(--u)*1.45)}
.ag-date .dn{font-family:var(--display);font-weight:300;font-size:calc(var(--u)*4);margin:calc(var(--u)*.35) 0 calc(var(--u)*.25)}
.ag-date .dm{color:var(--mute);font-family:var(--display);font-weight:300;letter-spacing:.22em;font-size:calc(var(--u)*1.35)}
/* Every row is as tall as a two-line title (text centred inside), so the rhythm is even and scroll offsets never shift. */
.ag-item{min-height:calc(var(--u)*11)}
.ag-title{font-family:var(--display);font-weight:300;font-size:calc(var(--u)*2.2);line-height:1.2;letter-spacing:.04em;color:rgba(243,236,223,.9);
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.ag-item.on .ag-title{color:var(--gold)}
.ag-sub{color:var(--faint);font-size:calc(var(--u)*1.85);margin-top:calc(var(--u)*.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Where the loop starts over, so Dec 31 → Oct 31 doesn't read as a date mistake. */
.ag-loop{display:flex;align-items:center;gap:calc(var(--u)*1.4);margin:calc(var(--u)*1.4) 0 calc(var(--u)*2.2);color:var(--gold);
  font-family:var(--display);font-weight:400;letter-spacing:.26em;text-transform:uppercase;font-size:calc(var(--u)*1.45)}
.ag-loop::before,.ag-loop::after{content:"";flex:1;height:1px;background:var(--line)}

/* Member perks: a page of OfficeRnD benefits (up to four) between event slides. It lives in .wide, a layer
   over the whole main area, and has an opaque ground, so it fades in over the event slide and the agenda alike. */
.main{position:relative}
.wide{position:absolute;inset:0;pointer-events:none}
.wide .slide{background:var(--bg)}
.slide.perks{display:flex;flex-direction:column;gap:calc(var(--u)*3)}
.pk-head{display:flex;align-items:flex-end;justify-content:space-between;gap:calc(var(--u)*3)}
.pk-head h1{margin:0;font-size:calc(var(--u)*5.6);line-height:1;color:var(--gold)}
.pk-note{color:var(--mute);font-size:calc(var(--u)*2.6);text-align:right}
.pk-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:calc(var(--u)*2.6);
  justify-content:center}
.pk{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;background:var(--panel);border-radius:var(--radius);overflow:hidden;
  border:1px solid rgba(var(--gold-rgb),.24)}
/* Image panel. Until the image is sorted (see look()), only the empty panel shows. Then:
   .is-photo - shown whole over a blurred, darkened copy of itself;
   .is-logo  - on a solid ground matching the logo's own edge colour (set inline), so a logo that comes
             in its own box fills the panel instead of floating like a sticker;
   .is-blend - a white-boxed logo: ivory ground, multiplied, so its white box becomes the ivory. */
.pk-img{position:relative;min-height:0;background:#1c1914;overflow:hidden;transition:background-color .4s}
.pk-img img,.pk-img .wash{opacity:0;transition:opacity .4s}
.pk-img.is-photo img,.pk-img.is-photo .wash,.pk-img.is-logo img{opacity:1}
.pk-img .wash{position:absolute;inset:-15%;background:center/cover no-repeat;filter:blur(calc(var(--u)*3)) brightness(.45) saturate(1.1)}
.pk-img img{position:absolute;inset:calc(var(--u)*2);width:calc(100% - var(--u)*4);height:calc(100% - var(--u)*4);object-fit:contain}
.pk-img.is-photo img{filter:drop-shadow(0 calc(var(--u)*.8) calc(var(--u)*2) rgba(0,0,0,.5))}
.pk-img.is-logo img{inset:14%;width:72%;height:72%}
.pk-img.is-bleed img{inset:0;width:100%;height:100%}
.pk-img.is-blend{background:var(--ivory)}
.pk-img.is-blend img{mix-blend-mode:multiply}
.pk-img.mono{display:grid;place-items:center;font-family:var(--display);color:var(--gold);font-size:calc(var(--u)*9)}
.pk-body{padding:calc(var(--u)*2.4) calc(var(--u)*2.6) calc(var(--u)*2.8);display:grid;gap:calc(var(--u)*1);align-content:start;
  height:calc(var(--u)*30);overflow:hidden} /* fixed, so every image panel on a page is the same size */
.pk-cat{color:var(--gold);font-family:var(--display);font-weight:400;letter-spacing:.24em;text-transform:uppercase;font-size:calc(var(--u)*1.8);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-name{font-family:var(--display);font-weight:300;letter-spacing:.03em;font-size:calc(var(--u)*3.1);line-height:1.1;text-wrap:pretty;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.pk-offer{margin:0;color:rgba(243,236,223,.86);font-size:calc(var(--u)*2.55);line-height:1.36;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}

/* Sign-off strip as on the menu: the logo centred over the frame's break, slide count and progress on
   the left, the clock on the right. */
footer{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:calc(var(--u)*3.5);
  font-family:var(--display);font-weight:300;font-size:calc(var(--u)*1.6);letter-spacing:.28em;text-transform:uppercase;color:var(--mute);
  font-variant-numeric:tabular-nums}
footer .side{display:flex;align-items:center;gap:calc(var(--u)*3);min-width:0}
footer .side>span{flex:none;white-space:nowrap}
.logo{height:calc(var(--u)*11.5);width:auto;display:block}
.rule{flex:1;height:1px;background:linear-gradient(270deg,rgba(var(--gold-rgb),.08),var(--hair))}
.rail{flex:1;height:1px;background:linear-gradient(90deg,rgba(var(--gold-rgb),.08),var(--hair));position:relative;overflow:hidden}
.rail i{position:absolute;inset:0;background:linear-gradient(90deg,rgba(var(--gold-rgb),.25),var(--gold));transform-origin:left;transform:scaleX(0)}
.rail i.run{animation:fill linear forwards;animation-duration:calc(var(--slide-ms) * 1ms)}
@keyframes fill{to{transform:scaleX(1)}}

.empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:calc(var(--u)*2)}
.empty h1{font-size:calc(var(--u)*6)}
.empty p{color:var(--mute);margin:0;font-size:calc(var(--u)*2.6)}

/* Phones and narrow windows: stack and scroll. */
@media (max-width:760px){
  :root{--u:1.6vw}
  .frame{display:none}
  footer{grid-template-columns:1fr}footer .side:last-child{display:none}.logo{height:72px;margin:0 auto}
  body{overflow:auto}
  .screen{height:auto;min-height:100%;padding:20px 16px}
  .main{grid-template-columns:1fr;gap:28px}
  .stage{min-height:auto}
  .agenda{border-left:0;padding-left:0}
  .ag-window{-webkit-mask-image:none;mask-image:none}
  .ag-list{transform:none!important}
  .ag-list .dup{display:none}
  .ag-head h2{font-size:24px}.ag-count{font-size:11px}.ag-title{font-size:17px}.ag-sub{font-size:13px}
  .ag-date .dn{font-size:26px}.ag-date .dw,.ag-date .dm{font-size:10px}.ag-item{grid-template-columns:48px 1fr}
  .slide{position:relative;display:none;grid-template-columns:1fr;gap:20px}
  .slide.on{display:grid}
  .art{padding:16px}
  h1{font-size:34px}
  .date{font-size:13px}.time{font-size:17px}.where{font-size:16px}.blurb{font-size:15px}
  .qr{width:120px}.rsvp .cta{font-size:24px}.rsvp .url{font-size:13px}
  .wide{position:static}.wide:empty{display:none}
  .slide.perks{display:none}.slide.perks.on{display:flex}
  .pk-head{flex-direction:column;align-items:flex-start}.pk-note{text-align:left;font-size:14px}
  .pk-grid{grid-template-columns:1fr 1fr!important}.pk-img{aspect-ratio:1}
  .pk-name{font-size:17px}.pk-cat{font-size:10px}.pk-offer{font-size:14px}.pk-body{min-height:0;padding:12px}
}
@media (prefers-reduced-motion:reduce){.slide{transition:none}.slide.on .art .wash,.rail i.run{animation:none}}
</style>

<div class="frame" id="frame" aria-hidden="true"></div>
<div class="screen" id="screen">
  <div class="main">
    <main class="stage" id="stage" aria-live="polite"></main>
    <aside class="agenda" aria-label="Upcoming events">
      <div class="ag-head"><h2>Upcoming events</h2><span class="ag-count" id="ag-count"></span></div>
      <div class="ag-window"><ol class="ag-list" id="agenda"></ol></div>
    </aside>
    <div class="wide" id="wide" aria-live="polite"></div>
  </div>
  <footer>
    <div class="side"><span id="count">–</span><div class="rail"><i id="rail"></i></div></div>
    <img class="logo" id="logo" src="assets/empire-logo-full.png" alt="Empire Scottsdale">
    <div class="side"><div class="rule"></div><span id="clock"></span></div>
  </footer>
</div>

<script>
const fan = (cx, cy, dir, len, spread, n) => {
  const pt = (deg, r) => [cx + r * Math.cos(deg * Math.PI / 180), cy + r * Math.sin(deg * Math.PI / 180)];
  const angs = [...Array(n)].map((_, k) => dir - spread + 2 * spread * k / (n - 1));
  const rays = angs.map(t => { const [x, y] = pt(t, len * .25), [X, Y] = pt(t, len); return `M${x} ${y}L${X} ${Y}`; }).join("");
  const edge = angs.slice(1).map((t, k) => { const [qx, qy] = pt((t + angs[k]) / 2, len * 1.22), [X, Y] = pt(t, len); return `Q${qx} ${qy} ${X} ${Y}`; }).join("");
  const [sx, sy] = pt(angs[0], len);
  return `<path d="${rays}M${sx} ${sy}${edge}"/><circle class="bead" cx="${cx}" cy="${cy}" r="${len * .12}"/>`;
};
const LEAF = `<path d="M0 0C.35-.3.85-.25 1 0C.85.25.35.3 0 0Z"/>`;
const CORNER = `
  <path d="M5.6 .9C7.6 .9 9.4 .8 10.7 1.6C11.6 2.2 11.3 3.3 10.4 3.2C9.7 3.1 9.7 2.3 10.2 2.2"/>
  <path d="M.9 5.6C.9 7.6 .8 9.4 1.6 10.7C2.2 11.6 3.3 11.3 3.2 10.4C3.1 9.7 2.3 9.7 2.2 10.2"/>
  <path d="M10.7 1.6C9.6 2.6 8.4 3 7.1 2.8"/><path d="M1.6 10.7C2.6 9.6 3 8.4 2.8 7.1"/>
  <path d="M11.9 1.1C12.9 .45 14.3 .5 15.5 .95C14.3 1.45 12.9 1.6 11.9 1.1Z"/><path d="M12.4 1.08L15 .97"/>
  <path d="M1.1 11.9C.45 12.9 .5 14.3 .95 15.5C1.45 14.3 1.6 12.9 1.1 11.9Z"/><path d="M1.08 12.4L.97 15"/>
  <path d="M15.5 .95C16.8 .9 17.6 1.5 17.4 2.2C17.2 2.8 16.4 2.7 16.5 2.1"/><path d="M.95 15.5C.9 16.8 1.5 17.6 2.2 17.4C2.8 17.2 2.7 16.4 2.1 16.5"/>
  <circle class="bead" cx="19" cy="1" r=".26"/><circle class="bead" cx="20.2" cy="1" r=".19"/><circle class="bead" cx="21.2" cy="1" r=".13"/>
  <circle class="bead" cx="1" cy="19" r=".26"/><circle class="bead" cx="1" cy="20.2" r=".19"/><circle class="bead" cx="1" cy="21.2" r=".13"/>
  ${fan(2.3, 2.3, 45, 1.75, 62, 5)}
  <g transform="translate(.3 .3) rotate(45)">${[0, 90, 180, 270].map(r => `<g transform="rotate(${r})">${LEAF}</g>`).join("")}</g>
  <circle class="bead" cx=".3" cy=".3" r=".22"/>`;
const BRACKET = `<path d="M0 0C-1.3 0-2.4-.4-2.7-1.4C-2.9-2.2-2.1-2.7-1.6-2.2C-1.2-1.8-1.5-1.3-1.9-1.4"/>
  <path d="M.6-.1C1.4-.6 2.6-.6 3.6-.1"/><circle class="bead" cx="0" cy="0" r=".3"/>`;
// The menu's frame, lighter: outer rule, inner rule with concave corners, a faint fillet, pearls and corner
// ornaments, with a break in the bottom rules where the logo sits, closed by scroll brackets.
function frame() {
  const W = innerWidth, H = innerHeight, u = Math.min(H / 100, W * .5625 / 100);
  const a = 1.7 * u, b = 2.8 * u, R = 3.6 * u, f = .9 * u, sw = Math.max(1, u * .11), C = 1.1;
  const gb = (document.getElementById("logo").offsetWidth || 15 * u) / 2 + 5 * u;
  const rule = (i, r) => {
    const o = Math.sqrt(r * r - (i - b) ** 2), arc = (x, y) => `A${r} ${r} 0 0 0 ${x} ${y}`;
    return `M${b + o} ${i}H${W - b - o}${arc(W - i, b + o)}V${H - b - o}${arc(W - b - o, H - i)}H${W / 2 + gb}
      M${W / 2 - gb} ${H - i}H${b + o}${arc(i, H - b - o)}V${b + o}${arc(b + o, i)}`;
  };
  const at = (x, y, sx, sy, art) => `<g transform="translate(${x} ${y}) scale(${u * sx} ${u * sy})">${art}</g>`;
  const m = (a + b) / 2, pearls = [];
  for (let x = m + 8 * u; x < W - m - 8 * u; x += 1.5 * u) {
    pearls.push([x, m]);
    if (Math.abs(x - W / 2) > gb + 1.5 * u) pearls.push([x, H - m]);
  }
  for (let y = m + 8 * u; y < H - m - 8 * u; y += 1.5 * u) pearls.push([m, y], [W - m, y]);
  const box = document.getElementById("frame");
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" stroke-width="${sw}">
    <path class="outer" d="M${W / 2 - gb} ${H - a}H${a}V${a}H${W - a}V${H - a}H${W / 2 + gb}"/>
    <path class="inner" d="${rule(b, R)}"/><path class="fillet" d="${rule(b + f, R + f)}"/>
    <g class="pearl">${pearls.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="${.13 * u}"/>`).join("")}</g>
    <g class="orn">${at(b, b, C, C, CORNER)}${at(W - b, b, -C, C, CORNER)}${at(b, H - b, C, -C, CORNER)}${at(W - b, H - b, -C, -C, CORNER)}
      ${at(W / 2 - gb, H - m, -1.2, 1.2, BRACKET)}${at(W / 2 + gb, H - m, 1.2, 1.2, BRACKET)}</g></svg>`;
  box.querySelectorAll(".orn *").forEach((el) => el.setAttribute("vector-effect", "non-scaling-stroke"));
}
frame();
document.getElementById("logo").addEventListener("load", frame);
addEventListener("resize", frame);

// Events come live from the Cloud Run function (URL in config.js); the last good list is kept for power cuts and outages.
const API = window.EMPIRE_EVENTS_API;
const REFRESH_MS = 5 * 60e3, CACHE_KEY = "empire-events", PERKS_KEY = "empire-perks";
let EVENTS = [], PERKS = [], loaded = false;
try { const c = JSON.parse(localStorage.getItem(CACHE_KEY)); if (Array.isArray(c)) { EVENTS = c; loaded = true; } } catch (_) {}
try { const c = JSON.parse(localStorage.getItem(PERKS_KEY)); if (Array.isArray(c)) PERKS = c; } catch (_) {}
const TZ = "America/Phoenix";
const SLIDE_MS = 15000;
const stage = document.getElementById("stage"), wide = document.getElementById("wide");
const fmt = (o) => new Intl.DateTimeFormat("en-US", { timeZone: TZ, ...o });
const fDate = fmt({ weekday: "long", month: "long", day: "numeric" }), fDay = fmt({ day: "numeric" }), fMon = fmt({ month: "long" });
const fTime = fmt({ hour: "numeric", minute: "2-digit" }), fShort = fmt({ month: "short", day: "numeric" });
const fClock = fmt({ weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const t = (d) => fTime.format(d).replace(":00", "");
const PIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';

function upcoming() {
  const now = Date.now();
  return EVENTS.filter((e) => new Date(e.start).getTime() > now);
}

function slideHTML(e) {
  const s = new Date(e.start), en = new Date(e.end);
  const sameDay = fShort.format(s) === fShort.format(en) || en - s < 12 * 3600e3;
  const when = sameDay ? `${t(s)} – ${t(en)}` : `${t(s)} · through ${fShort.format(en)}`;
  const url = e.link.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
  const art = e.image
    ? `<div class="art"><div class="wash" style="background-image:url('${esc(e.image)}')"></div><img src="${esc(e.image)}" alt="" onload="sizeArt(this)"></div>`
    : `<div class="art datecard"><span class="dnum">${fDay.format(s)}</span><span class="dmon">${fMon.format(s)}</span></div>`;
  const rsvp = e.qr
    ? `<div class="rsvp"><div class="qr">${e.qr}</div><div><div class="cta">Scan to RSVP</div><div class="url">${esc(url)}</div></div></div>`
    : `<div class="rsvp walkin"><div><span class="pill">No RSVP needed</span><div class="cta">Just show up</div></div></div>`;
  return `<article class="slide">
    ${art}
    <div class="info">
      <div class="top">
        <div class="date">${fDate.format(s)}</div>
        <div class="time">${when}</div>
        <h1>${esc(e.title)}</h1>
        <div class="where">${PIN}<span>${esc(e.where)}</span></div>
        ${e.blurb ? `<p class="blurb">${esc(e.blurb)}</p>` : ""}
      </div>
      ${rsvp}
    </div>
  </article>`;
}

// Member perks: pages of at most four, as even as possible (18 → 4,4,4,3,3), never one slide per perk.
const PERKS_PER_PAGE = 4;
function perkPages() {
  const n = PERKS.length;
  if (!n) return [];
  const pages = Math.ceil(n / PERKS_PER_PAGE), base = Math.floor(n / pages), extra = n % pages, out = [];
  for (let p = 0, at = 0; p < pages; p++) { const size = base + (p < extra ? 1 : 0); out.push(PERKS.slice(at, at + size)); at += size; }
  return out;
}

// The running order: every event once, with the perk pages spread as evenly as the counts allow
// (12 events, 5 pages → a page after events 2, 5, 7, 10 and 12). Items are {k: event index} or {p: page index}.
function deck(list, pages) {
  if (!pages.length) return list.map((_, k) => ({ k }));
  if (!list.length) return pages.map((_, p) => ({ p }));
  const n = list.length, out = [];
  let p = 0;
  list.forEach((_, k) => {
    out.push({ k });
    while (p < pages.length && k + 1 >= Math.round(((p + 1) * n) / pages.length)) out.push({ p: p++ });
  });
  return out;
}

// Sort each perk image once, from a 48px copy: a photo, or a logo with a solid (or transparent) edge.
// A logo gets a ground matching its own edge, so a logo that comes in a white or black box fills the
// panel instead of floating on it. The CDN sends Access-Control-Allow-Origin: *, so the canvas is readable;
// if it ever isn't, the image is simply treated as a photo.
const LOOKS = new Map();
function look(url) {
  if (!LOOKS.has(url)) LOOKS.set(url, new Promise((done) => {
    const im = new Image();
    im.crossOrigin = "anonymous";
    im.onload = () => { try { done(classify(im)); } catch (_) { done({ mode: "is-photo" }); } };
    im.onerror = () => done({ mode: "is-photo" });
    im.src = url;
  }));
  return LOOKS.get(url);
}
function classify(im) {
  const N = 48, c = document.createElement("canvas");
  c.width = c.height = N;
  const x = c.getContext("2d", { willReadFrequently: true });
  x.drawImage(im, 0, 0, N, N);
  const d = x.getImageData(0, 0, N, N).data, lum = (r, g, b) => 0.2126 * r + 0.7152 * g + 0.0722 * b, edge = [];
  for (let y = 0; y < N; y++) for (let X = 0; X < N; X++) {
    if (y > 1 && y < N - 2 && X > 1 && X < N - 2) continue;
    const o = (y * N + X) * 4;
    edge.push([d[o], d[o + 1], d[o + 2], d[o + 3]]);
  }
  if (edge.filter((q) => q[3] < 40).length / edge.length > 0.6) {
    // Transparent logo: dark ink goes on ivory, light ink on charcoal.
    let sum = 0, cnt = 0;
    for (let o = 0; o < d.length; o += 4) if (d[o + 3] > 128) { sum += lum(d[o], d[o + 1], d[o + 2]); cnt++; }
    return cnt && sum / cnt < 140 ? { mode: "is-logo is-blend" } : { mode: "is-logo", bg: "#262626" };
  }
  const solid = edge.filter((q) => q[3] >= 40);
  const med = [0, 1, 2].map((i) => solid.map((q) => q[i]).sort((a, b) => a - b)[solid.length >> 1]);
  const close = (q) => q[3] >= 40 && Math.hypot(q[0] - med[0], q[1] - med[1], q[2] - med[2]) < 36;
  // Solid ground: two whole sides in the edge colour, or half the edge (wordmarks often run into the edges).
  const sides = [edge.slice(0, 2 * N), edge.slice(-2 * N), edge.filter((_, j) => j >= 2 * N && j < edge.length - 2 * N && j % 4 < 2),
    edge.filter((_, j) => j >= 2 * N && j < edge.length - 2 * N && j % 4 >= 2)];
  const solidSides = sides.filter((side) => side.filter(close).length / side.length > 0.9).length;
  if (solidSides < 2 && edge.filter(close).length / edge.length < 0.5) return { mode: "is-photo" };
  // Cut-out logos (transparent shapes inside an opaque box) would vanish on a matching ground.
  let holes = 0;
  for (let o = 3; o < d.length; o += 4) if (d[o] < 40) holes++;
  if (holes / (N * N) > 0.04) return { mode: "is-photo" };
  if (lum(...med) > 200) return { mode: "is-logo is-blend" }; // white box → ivory, multiplied
  // A coloured ground that isn't quite the image's whole edge (art running into the edge): span the full width.
  const partial = edge.filter(close).length / edge.length < 0.85;
  return { mode: partial ? "is-logo is-bleed" : "is-logo", bg: `rgb(${med.join(",")})` };
}
function dressImages(root) {
  root.querySelectorAll(".pk-img[data-src]").forEach((el) => look(el.dataset.src).then((r) => {
    el.className = `pk-img ${r.mode}`;
    if (r.bg) el.style.backgroundColor = r.bg;
  }));
}

// Long names shrink (down to 2.5u) to stay on two lines; if a long word still forces a third line,
// the name gets it and the offer gives up one line instead.
function fitPerks(slide) {
  if (narrow.matches) return;
  const u = Math.min(innerHeight / 100, innerWidth * 0.005625);
  slide.querySelectorAll(".pk").forEach((card) => {
    const n = card.querySelector(".pk-name"), offer = card.querySelector(".pk-offer");
    n.style.webkitLineClamp = "none"; // measure the real line count
    let lines = 0;
    for (let size = 3.1; size >= 2.49; size -= 0.2) {
      n.style.fontSize = size * u + "px";
      lines = Math.round(n.getBoundingClientRect().height / (size * u * 1.1));
      if (lines <= 2) break;
    }
    n.style.webkitLineClamp = lines > 2 ? 3 : "";
    if (offer) offer.style.webkitLineClamp = lines > 2 ? 3 : "";
  });
}

const initial = (s) => esc(s.replace(/^the\s+/i, "").charAt(0).toUpperCase());
function perksHTML(page) {
  return `<article class="slide perks">
    <div class="pk-head">
      <h1>Member perks</h1>
      <div class="pk-note">Details and codes in the Empire app</div>
    </div>
    <div class="pk-grid" style="--cols:${Math.max(page.length, 3)}">${page.map((b) => `
      <div class="pk">
        ${b.image
          ? `<div class="pk-img" data-src="${esc(b.image)}"><div class="wash" style="background-image:url('${esc(b.image)}')"></div><img src="${esc(b.image)}" alt=""></div>`
          : `<div class="pk-img mono">${initial(b.name)}</div>`}
        <div class="pk-body">
          <div class="pk-cat">${b.category ? esc(b.category) : "&nbsp;"}</div>
          <div class="pk-name">${esc(b.name)}</div>
          ${b.offer ? `<p class="pk-offer">${esc(b.offer)}</p>` : ""}
        </div>
      </div>`).join("")}
    </div>
  </article>`;
}

// The flyer gets the largest box that fits its panel (inset by 3u), scaling small images up.
const narrow = matchMedia("(max-width:760px)");
function sizeArt(img) {
  if (!img.naturalWidth) return;
  if (narrow.matches) { img.style.width = "100%"; img.style.height = "auto"; return; }
  const panel = img.parentElement, pad = 6 * Math.min(innerHeight / 100, innerWidth * 0.005625);
  const ar = img.naturalWidth / img.naturalHeight;
  const w = Math.min(panel.clientWidth - pad, (panel.clientHeight - pad) * ar);
  img.style.width = w + "px";
  img.style.height = w / ar + "px";
}

// Make everything fit without squashing: the title shrinks first (to at most three lines), and only
// if it is already at its smallest does the blurb give up lines. Promo-code lines lead the blurb,
// so they are the last thing to go.
function fit(slide) {
  const img = slide.querySelector(".art img");
  if (img?.complete) sizeArt(img);
  const h1 = slide.querySelector("h1"), top = slide.querySelector(".top"), blurb = slide.querySelector(".blurb");
  if (narrow.matches) { h1.style.fontSize = ""; return; } // phones scroll; the CSS sizes are enough
  blurb?.style.setProperty("--clamp", 4); // start from the full blurb on every (re)fit
  const u = Math.min(innerHeight / 100, innerWidth * 0.005625);
  const fits = () => top.scrollHeight <= top.clientHeight + 1;
  for (let size = 7; size >= 3.6; size -= 0.25) {
    h1.style.fontSize = size * u + "px";
    if (h1.offsetHeight <= size * u * 1.04 * 3 + 2 && fits()) return;
  }
  if (!blurb) return;
  for (let lines = 3; lines >= 2; lines--) {
    blurb.style.setProperty("--clamp", lines);
    if (fits()) return;
  }
}

// Agenda: rebuilt only when the event list changes. The featured event sits one row down, under the
// previous event (faded by the mask), so the top row never reads as "next". Rows are laid out as
// [last event, loop divider] + events + [loop divider, events again] so the loop is seamless both ways.
const agendaEl = document.getElementById("agenda"), fDw = fmt({ weekday: "short" }), fMs = fmt({ month: "short" });
let agendaKey = "", agendaAt = -1, agendaCur = -1;
const LOOP = `<li class="ag-loop dup" aria-hidden="true">Back to the first event</li>`;
function agendaRow(e, k, dup) {
  const s = new Date(e.start);
  return `<li class="ag-item${dup ? " dup" : ""}" data-k="${k}" ${dup ? 'aria-hidden="true"' : ""}>
    <div class="ag-date"><span class="dw">${fDw.format(s).toUpperCase()}</span><span class="dn">${fDay.format(s)}</span><span class="dm">${fMs.format(s).toUpperCase()}</span></div>
    <div><div class="ag-title">${esc(e.title)}</div><div class="ag-sub">${t(s)} · ${esc(e.where)}</div></div>
  </li>`;
}
function renderAgenda(list, k, step) {
  const key = list.map((e) => e.id + e.start).join("|");
  if (key !== agendaKey) {
    agendaKey = key;
    const n = list.length, loop = n > 1;
    agendaEl.innerHTML = (loop ? agendaRow(list[n - 1], n - 1, true) + LOOP : "") +
      list.map((e, j) => agendaRow(e, j)).join("") +
      (loop ? LOOP + list.map((e, j) => agendaRow(e, j, true)).join("") : "");
    agendaAt = -1;
    const last = new Date(list[n - 1].start);
    document.getElementById("ag-count").textContent = `${n} event${n > 1 ? "s" : ""} · through ${fShort.format(last)}`;
  }
  agendaEl.querySelectorAll(".ag-item").forEach((li) => li.classList.toggle("on", +li.dataset.k === k));
  const n = list.length, pre = n > 1 ? 2 : 0; // child index of event k is pre + k; its second copy is pre + n + 1 + k
  if (agendaAt === n - 1 && k === 0 && step === 1) {
    // Wrap forwards: glide onto the second copy of the first event, then jump to the real one (same view).
    agendaMove(pre + n + 1, true);
    setTimeout(() => agendaMove(pre, false), 950);
  } else {
    agendaMove(pre + k, agendaAt >= 0 && Math.abs(k - agendaAt) === 1);
  }
  agendaAt = k;
}
// Scroll so the event row before child `idx` is at the top (skipping a loop divider), i.e. the featured row is one down.
function agendaMove(idx, animate) {
  const row = agendaEl.children[idx];
  if (!row) return;
  agendaCur = idx;
  let prev = row.previousElementSibling;
  while (prev && prev.classList.contains("ag-loop")) prev = prev.previousElementSibling;
  agendaEl.classList.toggle("snap", !animate);
  agendaEl.style.transform = `translateY(${-(prev ? prev.offsetTop : 0)}px)`;
}
// Late font loads or a resize change row heights: re-align on the featured row without animating.
new ResizeObserver(() => { if (agendaCur >= 0) agendaMove(agendaCur, false); }).observe(agendaEl);

function preload() {
  EVENTS.forEach((e) => { if (e.image) new Image().src = e.image; });
  PERKS.forEach((b) => { if (b.image) { new Image().src = b.image; look(b.image); } });
}

async function refresh() {
  if (!API) return console.warn("EMPIRE_EVENTS_API is not set in config.js");
  try {
    const r = await fetch(API, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const { events, benefits } = await r.json();
    if (!Array.isArray(events)) throw new Error("bad response");
    const wasEmpty = !upcoming().length && !PERKS.length;
    EVENTS = events;
    // benefits is null when the function couldn't fetch them: keep the perks we have.
    if (Array.isArray(benefits)) PERKS = benefits;
    loaded = true;
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(EVENTS)); localStorage.setItem(PERKS_KEY, JSON.stringify(PERKS)); } catch (_) {}
    preload();
    if (wasEmpty) show(); // leave "Loading…" / "No upcoming events" straight away
  } catch (err) {
    console.warn("events refresh failed; keeping last list", err);
  }
}

// Reload once a day between slides so page updates pushed to GitHub Pages reach the TV.
const BOOTED = Date.now();

let i = (parseInt(location.hash.slice(1), 10) || 1) - 2, timer; // #3 opens on the third slide
function show(step = 1) {
  if (Date.now() - BOOTED > 24 * 3600e3 && navigator.onLine) return location.reload();
  const list = upcoming(), pages = perkPages(), d = deck(list, pages);
  clearTimeout(timer);
  if (!d.length) {
    wide.innerHTML = "";
    stage.innerHTML = loaded
      ? `<div class="empty"><h1>No upcoming events</h1><p>Check back soon.</p></div>`
      : `<div class="empty"><h1>Loading events…</h1></div>`;
    document.getElementById("count").textContent = "";
    agendaEl.innerHTML = ""; agendaKey = "";
    document.getElementById("ag-count").textContent = "";
    timer = setTimeout(show, loaded ? SLIDE_MS * 4 : 2000);
    return;
  }
  i = (i + step + d.length) % d.length;
  const item = d[i], isPerks = item.p !== undefined;
  const host = isPerks ? wide : stage;
  host.insertAdjacentHTML("beforeend", isPerks ? perksHTML(pages[item.p]) : slideHTML(list[item.k]));
  const el = host.lastElementChild;
  if (isPerks) { dressImages(el); fitPerks(el); }
  if (!isPerks) fit(el);
  // Retire every other slide: the newest one fades out, anything older goes now. Don't rely on
  // requestAnimationFrame here: hidden tabs and sleeping TVs pause it, and slides would pile up.
  const others = [...document.querySelectorAll(".stage .slide, .wide .slide")].filter((s) => s !== el);
  others.forEach((s, j) => {
    s.classList.remove("on");
    if (j < others.length - 1) s.remove(); else setTimeout(() => s.remove(), 900);
  });
  void el.offsetWidth; // commit the hidden state so the fade-in still animates
  el.classList.add("on");
  stage.querySelectorAll(".empty").forEach((n) => n.remove());
  document.getElementById("count").textContent = isPerks
    ? `Member perks · ${item.p + 1} of ${pages.length}` : `${item.k + 1} of ${list.length}`;
  if (!isPerks) renderAgenda(list, item.k, step);
  else if (list.length) {
    // Hold the agenda on the event just shown (or the last one), with nothing highlighted.
    let j = i;
    while (j > 0 && d[j].k === undefined) j--;
    renderAgenda(list, d[j].k ?? list.length - 1, 0);
    agendaEl.querySelectorAll(".ag-item.on").forEach((li) => li.classList.remove("on"));
  } else { agendaEl.innerHTML = ""; agendaKey = ""; document.getElementById("ag-count").textContent = ""; }
  const rail = document.getElementById("rail");
  rail.classList.remove("run"); void rail.offsetWidth; rail.classList.add("run");
  timer = setTimeout(show, SLIDE_MS);
}

function tick() { document.getElementById("clock").textContent = fClock.format(new Date()); }
tick(); setInterval(tick, 15000);
preload();
// Measure titles with the real fonts, not the fallbacks.
(document.fonts?.ready ?? Promise.resolve()).then(() => { show(); refresh(); });
setInterval(refresh, REFRESH_MS);
// Refit when the window changes or a web font finishes loading (its metrics differ from the fallback's).
const refit = () => { stage.querySelectorAll(".slide").forEach(fit); wide.querySelectorAll(".slide").forEach(fitPerks); };
addEventListener("resize", refit);
document.fonts?.addEventListener("loadingdone", refit);

document.addEventListener("keydown", (ev) => {
  if (ev.key === "ArrowRight" || ev.key === " ") { ev.preventDefault(); show(1); }
  if (ev.key === "ArrowLeft") show(-1);
  if (ev.key === "f") document.documentElement.requestFullscreen?.().catch(() => {});
});
const screenEl = document.getElementById("screen");
let idle;
document.addEventListener("mousemove", () => { screenEl.classList.add("awake"); clearTimeout(idle); idle = setTimeout(() => screenEl.classList.remove("awake"), 3000); });
document.addEventListener("click", () => document.documentElement.requestFullscreen?.().catch(() => {}));
async function wake() { try { await navigator.wakeLock?.request("screen"); } catch (_) {} }
wake(); document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && wake());
</script>
