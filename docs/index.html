<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="config.js"></script>
<title>Empire Events Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preload" href="fonts/lemonmilk-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/spitz-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/spitz-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Inter+Tight:wght@400;500;600&display=swap">
<style>
/* Empire brand fonts, served under Empire's web licences: Lemon Milk (display) and Linotype Spitz (text).
   Forum / Inter Tight are fallbacks while they load. */
@font-face{font-family:"Lemon Milk";src:url(fonts/lemonmilk-300.woff2) format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:"Lemon Milk";src:url(fonts/lemonmilk-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Lemon Milk";src:url(fonts/lemonmilk-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Lemon Milk";src:url(fonts/lemonmilk-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Linotype Spitz";src:url(fonts/spitz-300.woff2) format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:"Linotype Spitz";src:url(fonts/spitz-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Linotype Spitz";src:url(fonts/spitz-700.woff2) format("woff2");font-weight:700;font-display:swap}
/* Empire Scottsdale brand (empirescottsdale.com): #131313 ground, #F2B000 gold, white type, 10–12px radii.
   Layout for a 16:9 lobby TV: flyer panel left, details right, RSVP card bottom-aligned with the flyer.
   --u is 1% of the screen height (capped by width), so everything scales from 720p to 4K. */
:root{
  --bg:#131313; --panel:#1c1c1c; --line:#2c2c2c;
  --gold:#f2b000; --white:#fff; --mute:rgba(255,255,255,.68); --faint:rgba(255,255,255,.45);
  --display:"Lemon Milk","Forum",Georgia,serif;
  --body:"Linotype Spitz","Inter Tight","Helvetica Neue",Arial,sans-serif;
  --u:min(1vh,.5625vw);
  --radius:calc(var(--u)*1.2);
  --slide-ms:15000;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--white);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
.screen{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:calc(var(--u)*3);
  padding:calc(var(--u)*3.6) max(16px,calc(var(--u)*5.2));cursor:none}
.screen.awake{cursor:default}

header{display:flex;justify-content:space-between;align-items:center;gap:16px}
.logo{height:calc(var(--u)*5.4);width:auto;display:block}
.meta{display:flex;align-items:center;gap:calc(var(--u)*2.4);font-size:calc(var(--u)*2.1);color:var(--mute);font-variant-numeric:tabular-nums}

/* Featured event on the left, the agenda of everything coming up on the right. */
.main{display:grid;grid-template-columns:minmax(0,1fr) calc(var(--u)*46);gap:calc(var(--u)*4.5);min-height:0}
.stage{position:relative;min-height:0}
.slide{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:calc(var(--u)*4.5);
  opacity:0;transition:opacity .8s ease;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}

/* Flyer panel: the flyer whole and as large as fits, over a blurred, darkened copy of itself. */
.art{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--panel);display:grid;place-items:center;min-height:0}
.art .wash{position:absolute;inset:-12%;background:center/cover no-repeat;filter:blur(calc(var(--u)*5)) brightness(.42) saturate(1.15);transform:scale(1.04)}
/* Sized by sizeArt() to the largest box that fits, so small source images scale up too. */
.art img{position:relative;display:block;max-width:none;border-radius:calc(var(--radius)*.6);box-shadow:0 calc(var(--u)*2) calc(var(--u)*6) rgba(0,0,0,.55)}
.slide.on .art .wash{animation:drift calc(var(--slide-ms)*1ms) linear forwards}
@keyframes drift{to{transform:scale(1.12)}}
/* No flyer: a big date card instead. */
.art.datecard{background:linear-gradient(160deg,#1f1f1f,#141414);align-content:center;justify-items:center;gap:calc(var(--u)*1)}
.datecard .dnum{font-family:var(--display);font-size:calc(var(--u)*30);line-height:.85;color:var(--gold)}
.datecard .dmon{font-weight:600;letter-spacing:.3em;text-transform:uppercase;font-size:calc(var(--u)*2.8)}

.info{display:flex;flex-direction:column;min-height:0;min-width:0;padding-block:calc(var(--u)*1)}
.top{display:flex;flex-direction:column;gap:calc(var(--u)*2.2);min-height:0;overflow:hidden}
.top>*{flex-shrink:0} /* overflow must show up on .top, where fit() measures it, not squash the items */
.date{color:var(--gold);font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:calc(var(--u)*2.8)}
.time{font-weight:500;font-size:calc(var(--u)*3.6);margin-top:calc(var(--u)*-1);font-variant-numeric:tabular-nums}
h1{font-family:var(--display);font-weight:400;margin:calc(var(--u)*.8) 0 calc(var(--u)*.2);line-height:1.04;text-wrap:balance;font-size:calc(var(--u)*7)}
.where{display:flex;align-items:center;gap:.5em;font-size:calc(var(--u)*3);font-weight:500}
.where svg{width:.95em;height:.95em;flex:none;fill:var(--gold)}
.blurb{margin:0;color:var(--mute);font-size:calc(var(--u)*2.7);line-height:1.45;max-width:34em;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--clamp,4);overflow:hidden}

/* RSVP card sits on the flyer's bottom edge. */
.rsvp{margin-top:auto;padding-top:calc(var(--u)*3);display:flex;align-items:center;gap:calc(var(--u)*3)}
.qr{flex:none;width:calc(var(--u)*20);aspect-ratio:1;background:var(--white);border-radius:var(--radius);padding:calc(var(--u)*1.5)}
.qr svg{display:block;width:100%;height:100%;fill:#131313}
.rsvp .cta{font-family:var(--display);font-size:calc(var(--u)*3.4);line-height:1.05}
.rsvp .url{color:var(--faint);font-size:calc(var(--u)*2.3);margin-top:calc(var(--u)*1);overflow-wrap:anywhere}
.rsvp .pill{display:inline-block;margin-bottom:calc(var(--u)*1.4);background:var(--gold);color:#131313;font-weight:600;font-size:calc(var(--u)*2);
  letter-spacing:.14em;text-transform:uppercase;padding:.55em 1em;border-radius:calc(var(--u)*.8)}
.rsvp.walkin .cta{color:var(--white)}
.rsvp.walkin .url{color:var(--mute)}

/* Agenda: every upcoming event, the featured one highlighted; the list glides up a row per slide
   and wraps (it is rendered twice so the loop is seamless). The fade at the bottom says "more below". */
.agenda{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);padding-left:calc(var(--u)*4)}
.ag-head{display:grid;gap:calc(var(--u)*1.1);padding-bottom:calc(var(--u)*2);border-bottom:1px solid var(--line)}
.ag-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:calc(var(--u)*3.3);line-height:1;white-space:nowrap}
.ag-count{color:var(--gold);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:calc(var(--u)*1.75);white-space:nowrap}
.ag-window{position:relative;flex:1;min-height:0;overflow:hidden;margin-top:calc(var(--u)*1.6);
  -webkit-mask-image:linear-gradient(transparent,#000 16%,#000 76%,transparent);mask-image:linear-gradient(transparent,#000 16%,#000 76%,transparent)}
.ag-list{list-style:none;margin:0;padding:0;transition:transform .9s cubic-bezier(.4,0,.2,1)}
.ag-list.snap{transition:none}
.ag-item{display:grid;grid-template-columns:calc(var(--u)*7.5) minmax(0,1fr);align-items:center;gap:calc(var(--u)*2.2);
  padding:calc(var(--u)*1.5) calc(var(--u)*1.8);margin-bottom:calc(var(--u)*.8);border-radius:var(--radius);
  border-left:calc(var(--u)*.45) solid transparent;transition:background .6s,border-color .6s}
.ag-item.on{background:var(--panel);border-left-color:var(--gold)}
.ag-date{display:grid;justify-items:center;line-height:1;font-variant-numeric:tabular-nums}
.ag-date .dw{color:var(--gold);font-weight:600;letter-spacing:.14em;font-size:calc(var(--u)*1.55)}
.ag-date .dn{font-family:var(--display);font-size:calc(var(--u)*4);margin:calc(var(--u)*.35) 0 calc(var(--u)*.25)}
.ag-date .dm{color:var(--mute);font-weight:600;letter-spacing:.14em;font-size:calc(var(--u)*1.45)}
/* Every row is as tall as a two-line title (text centred inside), so the rhythm is even and scroll offsets never shift. */
.ag-item{min-height:calc(var(--u)*11)}
.ag-title{font-family:var(--display);font-size:calc(var(--u)*2.2);line-height:1.18;letter-spacing:.01em;color:rgba(255,255,255,.88);
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.ag-item.on .ag-title{color:var(--white)}
.ag-sub{color:var(--faint);font-size:calc(var(--u)*1.85);margin-top:calc(var(--u)*.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Where the loop starts over, so Dec 31 → Oct 31 doesn't read as a date mistake. */
.ag-loop{display:flex;align-items:center;gap:calc(var(--u)*1.4);margin:calc(var(--u)*1.4) 0 calc(var(--u)*2.2);color:var(--gold);
  font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:calc(var(--u)*1.45)}
.ag-loop::before,.ag-loop::after{content:"";flex:1;height:1px;background:var(--line)}

footer{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:calc(var(--u)*2.6);color:var(--faint);
  font-size:calc(var(--u)*1.9);font-variant-numeric:tabular-nums}
.rail{height:calc(var(--u)*.35);min-height:2px;background:var(--line);position:relative;overflow:hidden;border-radius:9px}
.rail i{position:absolute;inset:0;background:var(--gold);transform-origin:left;transform:scaleX(0)}
.rail i.run{animation:fill linear forwards;animation-duration:calc(var(--slide-ms) * 1ms)}
@keyframes fill{to{transform:scaleX(1)}}

.empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:calc(var(--u)*2)}
.empty h1{font-size:calc(var(--u)*6)}
.empty p{color:var(--mute);margin:0;font-size:calc(var(--u)*2.6)}

/* Phones and narrow windows: stack and scroll. */
@media (max-width:760px){
  :root{--u:1.6vw}
  body{overflow:auto}
  .screen{height:auto;min-height:100%;padding:20px 16px}
  .main{grid-template-columns:1fr;gap:28px}
  .stage{min-height:auto}
  .agenda{border-left:0;padding-left:0}
  .ag-window{-webkit-mask-image:none;mask-image:none}
  .ag-list{transform:none!important}
  .ag-list .dup{display:none}
  .ag-head h2{font-size:24px}.ag-count{font-size:11px}.ag-title{font-size:17px}.ag-sub{font-size:13px}
  .ag-date .dn{font-size:26px}.ag-date .dw,.ag-date .dm{font-size:10px}.ag-item{grid-template-columns:48px 1fr}
  .slide{position:relative;display:none;grid-template-columns:1fr;gap:20px}
  .slide.on{display:grid}
  .art{padding:16px}
  h1{font-size:34px}
  .date{font-size:13px}.time{font-size:17px}.where{font-size:16px}.blurb{font-size:15px}
  .qr{width:120px}.rsvp .cta{font-size:24px}.rsvp .url{font-size:13px}
}
@media (prefers-reduced-motion:reduce){.slide{transition:none}.slide.on .art .wash,.rail i.run{animation:none}}
</style>

<div class="screen" id="screen">
  <header>
    <img class="logo" src="assets/empire-logo.png" alt="Empire Scottsdale">
    <div class="meta"><span id="clock"></span></div>
  </header>
  <div class="main">
    <main class="stage" id="stage" aria-live="polite"></main>
    <aside class="agenda" aria-label="Upcoming events">
      <div class="ag-head"><h2>Upcoming events</h2><span class="ag-count" id="ag-count"></span></div>
      <div class="ag-window"><ol class="ag-list" id="agenda"></ol></div>
    </aside>
  </div>
  <footer>
    <span id="count">–</span>
    <div class="rail"><i id="rail"></i></div>
  </footer>
</div>

<script>
// Events come live from the Cloud Run function (URL in config.js); the last good list is kept for power cuts and outages.
const API = window.EMPIRE_EVENTS_API;
const REFRESH_MS = 5 * 60e3, CACHE_KEY = "empire-events";
let EVENTS = [], loaded = false;
try { const c = JSON.parse(localStorage.getItem(CACHE_KEY)); if (Array.isArray(c)) { EVENTS = c; loaded = true; } } catch (_) {}
const TZ = "America/Phoenix";
const SLIDE_MS = 15000;
const stage = document.getElementById("stage");
const fmt = (o) => new Intl.DateTimeFormat("en-US", { timeZone: TZ, ...o });
const fDate = fmt({ weekday: "long", month: "long", day: "numeric" }), fDay = fmt({ day: "numeric" }), fMon = fmt({ month: "long" });
const fTime = fmt({ hour: "numeric", minute: "2-digit" }), fShort = fmt({ month: "short", day: "numeric" });
const fClock = fmt({ weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const t = (d) => fTime.format(d).replace(":00", "");
const PIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';

function upcoming() {
  const now = Date.now();
  return EVENTS.filter((e) => new Date(e.start).getTime() > now);
}

function slideHTML(e) {
  const s = new Date(e.start), en = new Date(e.end);
  const sameDay = fShort.format(s) === fShort.format(en) || en - s < 12 * 3600e3;
  const when = sameDay ? `${t(s)} – ${t(en)}` : `${t(s)} · through ${fShort.format(en)}`;
  const url = e.link.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
  const art = e.image
    ? `<div class="art"><div class="wash" style="background-image:url('${esc(e.image)}')"></div><img src="${esc(e.image)}" alt="" onload="sizeArt(this)"></div>`
    : `<div class="art datecard"><span class="dnum">${fDay.format(s)}</span><span class="dmon">${fMon.format(s)}</span></div>`;
  const rsvp = e.qr
    ? `<div class="rsvp"><div class="qr">${e.qr}</div><div><div class="cta">Scan to RSVP</div><div class="url">${esc(url)}</div></div></div>`
    : `<div class="rsvp walkin"><div><span class="pill">No RSVP needed</span><div class="cta">Just show up</div></div></div>`;
  return `<article class="slide">
    ${art}
    <div class="info">
      <div class="top">
        <div class="date">${fDate.format(s)}</div>
        <div class="time">${when}</div>
        <h1>${esc(e.title)}</h1>
        <div class="where">${PIN}<span>${esc(e.where)}</span></div>
        ${e.blurb ? `<p class="blurb">${esc(e.blurb)}</p>` : ""}
      </div>
      ${rsvp}
    </div>
  </article>`;
}

// The flyer gets the largest box that fits its panel (inset by 3u), scaling small images up.
const narrow = matchMedia("(max-width:760px)");
function sizeArt(img) {
  if (!img.naturalWidth) return;
  if (narrow.matches) { img.style.width = "100%"; img.style.height = "auto"; return; }
  const panel = img.parentElement, pad = 6 * Math.min(innerHeight / 100, innerWidth * 0.005625);
  const ar = img.naturalWidth / img.naturalHeight;
  const w = Math.min(panel.clientWidth - pad, (panel.clientHeight - pad) * ar);
  img.style.width = w + "px";
  img.style.height = w / ar + "px";
}

// Make everything fit without squashing: the title shrinks first (to at most three lines), and only
// if it is already at its smallest does the blurb give up lines. Promo-code lines lead the blurb,
// so they are the last thing to go.
function fit(slide) {
  const img = slide.querySelector(".art img");
  if (img?.complete) sizeArt(img);
  const h1 = slide.querySelector("h1"), top = slide.querySelector(".top"), blurb = slide.querySelector(".blurb");
  if (narrow.matches) { h1.style.fontSize = ""; return; } // phones scroll; the CSS sizes are enough
  blurb?.style.setProperty("--clamp", 4); // start from the full blurb on every (re)fit
  const u = Math.min(innerHeight / 100, innerWidth * 0.005625);
  const fits = () => top.scrollHeight <= top.clientHeight + 1;
  for (let size = 7; size >= 3.6; size -= 0.25) {
    h1.style.fontSize = size * u + "px";
    if (h1.offsetHeight <= size * u * 1.04 * 3 + 2 && fits()) return;
  }
  if (!blurb) return;
  for (let lines = 3; lines >= 2; lines--) {
    blurb.style.setProperty("--clamp", lines);
    if (fits()) return;
  }
}

// Agenda: rebuilt only when the event list changes. The featured event sits one row down, under the
// previous event (faded by the mask), so the top row never reads as "next". Rows are laid out as
// [last event, loop divider] + events + [loop divider, events again] so the loop is seamless both ways.
const agendaEl = document.getElementById("agenda"), fDw = fmt({ weekday: "short" }), fMs = fmt({ month: "short" });
let agendaKey = "", agendaAt = -1, agendaCur = -1;
const LOOP = `<li class="ag-loop dup" aria-hidden="true">Back to the first event</li>`;
function agendaRow(e, k, dup) {
  const s = new Date(e.start);
  return `<li class="ag-item${dup ? " dup" : ""}" data-k="${k}" ${dup ? 'aria-hidden="true"' : ""}>
    <div class="ag-date"><span class="dw">${fDw.format(s).toUpperCase()}</span><span class="dn">${fDay.format(s)}</span><span class="dm">${fMs.format(s).toUpperCase()}</span></div>
    <div><div class="ag-title">${esc(e.title)}</div><div class="ag-sub">${t(s)} · ${esc(e.where)}</div></div>
  </li>`;
}
function renderAgenda(list, k, step) {
  const key = list.map((e) => e.id + e.start).join("|");
  if (key !== agendaKey) {
    agendaKey = key;
    const n = list.length, loop = n > 1;
    agendaEl.innerHTML = (loop ? agendaRow(list[n - 1], n - 1, true) + LOOP : "") +
      list.map((e, j) => agendaRow(e, j)).join("") +
      (loop ? LOOP + list.map((e, j) => agendaRow(e, j, true)).join("") : "");
    agendaAt = -1;
    const last = new Date(list[n - 1].start);
    document.getElementById("ag-count").textContent = `${n} event${n > 1 ? "s" : ""} · through ${fShort.format(last)}`;
  }
  agendaEl.querySelectorAll(".ag-item").forEach((li) => li.classList.toggle("on", +li.dataset.k === k));
  const n = list.length, pre = n > 1 ? 2 : 0; // child index of event k is pre + k; its second copy is pre + n + 1 + k
  if (agendaAt === n - 1 && k === 0 && step === 1) {
    // Wrap forwards: glide onto the second copy of the first event, then jump to the real one (same view).
    agendaMove(pre + n + 1, true);
    setTimeout(() => agendaMove(pre, false), 950);
  } else {
    agendaMove(pre + k, agendaAt >= 0 && Math.abs(k - agendaAt) === 1);
  }
  agendaAt = k;
}
// Scroll so the event row before child `idx` is at the top (skipping a loop divider), i.e. the featured row is one down.
function agendaMove(idx, animate) {
  const row = agendaEl.children[idx];
  if (!row) return;
  agendaCur = idx;
  let prev = row.previousElementSibling;
  while (prev && prev.classList.contains("ag-loop")) prev = prev.previousElementSibling;
  agendaEl.classList.toggle("snap", !animate);
  agendaEl.style.transform = `translateY(${-(prev ? prev.offsetTop : 0)}px)`;
}
// Late font loads or a resize change row heights: re-align on the featured row without animating.
new ResizeObserver(() => { if (agendaCur >= 0) agendaMove(agendaCur, false); }).observe(agendaEl);

function preload() { EVENTS.forEach((e) => { if (e.image) new Image().src = e.image; }); }

async function refresh() {
  if (!API) return console.warn("EMPIRE_EVENTS_API is not set in config.js");
  try {
    const r = await fetch(API, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const { events } = await r.json();
    if (!Array.isArray(events)) throw new Error("bad response");
    const wasEmpty = !upcoming().length;
    EVENTS = events;
    loaded = true;
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(EVENTS)); } catch (_) {}
    preload();
    if (wasEmpty) show(); // leave "Loading…" / "No upcoming events" straight away
  } catch (err) {
    console.warn("events refresh failed; keeping last list", err);
  }
}

// Reload once a day between slides so page updates pushed to GitHub Pages reach the TV.
const BOOTED = Date.now();

let i = (parseInt(location.hash.slice(1), 10) || 1) - 2, timer; // #3 opens on the third slide
function show(step = 1) {
  if (Date.now() - BOOTED > 24 * 3600e3 && navigator.onLine) return location.reload();
  const list = upcoming();
  clearTimeout(timer);
  if (!list.length) {
    stage.innerHTML = loaded
      ? `<div class="empty"><h1>No upcoming events</h1><p>Check back soon.</p></div>`
      : `<div class="empty"><h1>Loading events…</h1></div>`;
    document.getElementById("count").textContent = "";
    agendaEl.innerHTML = ""; agendaKey = "";
    document.getElementById("ag-count").textContent = "";
    timer = setTimeout(show, loaded ? SLIDE_MS * 4 : 2000);
    return;
  }
  i = (i + step + list.length) % list.length;
  const e = list[i];
  stage.insertAdjacentHTML("beforeend", slideHTML(e));
  const el = stage.lastElementChild;
  fit(el);
  // Retire every other slide: the newest one fades out, anything older goes now. Don't rely on
  // requestAnimationFrame here: hidden tabs and sleeping TVs pause it, and slides would pile up.
  const others = [...stage.querySelectorAll(".slide")].filter((s) => s !== el);
  others.forEach((s, j) => {
    s.classList.remove("on");
    if (j < others.length - 1) s.remove(); else setTimeout(() => s.remove(), 900);
  });
  void el.offsetWidth; // commit the hidden state so the fade-in still animates
  el.classList.add("on");
  stage.querySelectorAll(".empty").forEach((n) => n.remove());
  document.getElementById("count").textContent = `${i + 1} of ${list.length}`;
  renderAgenda(list, i, step);
  const rail = document.getElementById("rail");
  rail.classList.remove("run"); void rail.offsetWidth; rail.classList.add("run");
  timer = setTimeout(show, SLIDE_MS);
}

function tick() { document.getElementById("clock").textContent = fClock.format(new Date()); }
tick(); setInterval(tick, 15000);
preload();
// Measure titles with the real fonts, not the fallbacks.
(document.fonts?.ready ?? Promise.resolve()).then(() => { show(); refresh(); });
setInterval(refresh, REFRESH_MS);
// Refit when the window changes or a web font finishes loading (its metrics differ from the fallback's).
const refit = () => stage.querySelectorAll(".slide").forEach(fit);
addEventListener("resize", refit);
document.fonts?.addEventListener("loadingdone", refit);

document.addEventListener("keydown", (ev) => {
  if (ev.key === "ArrowRight" || ev.key === " ") { ev.preventDefault(); show(1); }
  if (ev.key === "ArrowLeft") show(-1);
  if (ev.key === "f") document.documentElement.requestFullscreen?.().catch(() => {});
});
const screenEl = document.getElementById("screen");
let idle;
document.addEventListener("mousemove", () => { screenEl.classList.add("awake"); clearTimeout(idle); idle = setTimeout(() => screenEl.classList.remove("awake"), 3000); });
document.addEventListener("click", () => document.documentElement.requestFullscreen?.().catch(() => {}));
async function wake() { try { await navigator.wakeLock?.request("screen"); } catch (_) {} }
wake(); document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && wake());
</script>
